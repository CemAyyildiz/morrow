name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Signer-discipline property suite (1,000 random hostile sequences)
        run: cargo test -p morrow-vault --release property -- --nocapture
      - run: cargo build -p morrow-vault --target wasm32-unknown-unknown --release

  node:
    name: TypeScript (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @morrow/web build
      - run: pnpm --filter @morrow/web exec playwright install --with-deps chromium
      - run: pnpm --filter @morrow/web e2e

  regtest:
    name: Regtest integration and Judge Mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: make regtest-up
      - name: core-ts tests including regtest integration
        env:
          MORROW_REGTEST_RPC: http://morrow:morrow@127.0.0.1:18443
        run: pnpm --filter @morrow/core-ts test
      - name: Escape tool against regtest
        env:
          MORROW_REGTEST_RPC: http://morrow:morrow@127.0.0.1:18443
        run: pnpm --filter @morrow/escape test
      - name: Challenge tool against regtest (Owner-Key-only spends refused)
        env:
          MORROW_REGTEST_RPC: http://morrow:morrow@127.0.0.1:18443
        run: pnpm --filter @morrow/challenge test
      - name: Judge Mode
        shell: bash
        run: |
          set -o pipefail
          make demo 2>&1 | tee judge.log
      - name: README expected lines in the Judge Mode log
        run: node .github/scripts/check-readme.mjs --log judge.log
      - name: Keep the Judge Mode log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-log
          path: judge.log
          if-no-files-found: ignore
      - if: always()
        run: make regtest-down

  repo:
    name: Repository hygiene and lanes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --test .github/scripts/*.test.mjs
      - run: node .github/scripts/check-hygiene.mjs
      - run: node .github/scripts/check-readme.mjs
      - name: Lane ownership
        if: github.event_name == 'pull_request'
        env:
          LANE_BASE_REF: origin/${{ github.base_ref }}
        run: node .github/scripts/check-lanes.mjs

  security:
    name: Secrets and dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the API
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level critical
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
