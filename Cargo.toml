[workspace]
resolver = "2"
members = ["contracts/vault", "contracts/mock-signer"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/CemAyyildiz/morrow"
publish = false

[workspace.dependencies]
near-sdk = "=5.30.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
